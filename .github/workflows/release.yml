name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Force version bump type (auto-appends 3rd digit by default)'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'minor'
          - 'major'

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply manual release bump override
        if: github.event.inputs.bump != 'auto' && github.event.inputs.bump != ''
        run: |
          BUMP="${{ github.event.inputs.bump }}"
          echo "Applying manual bump override: $BUMP"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$BUMP" = "minor" ]; then
            git commit --allow-empty -m "bump(compat): next app version release"
          elif [ "$BUMP" = "major" ]; then
            git commit --allow-empty -m "major: manual major release"
          fi

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid generatePatchesList -Pgpr.user=${{ github.actor }} -Pgpr.key=${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Clean intermediate build files
        run: rm -f patches/build/libs/*.mpp

      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Google Photos Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      - name: Purge jsDelivr Cache
        run: |
          for file in patches-bundle.json patches-list.json; do
            curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}/$file"
          done

      - name: Trigger GooglePhotos-Patched Build Workflow
        if: steps.release.outputs.new_release_published == 'true'
        env:
          DISPATCH_TOKEN: ${{ secrets.GPR_KEY }}
        run: |
          echo "Triggering build_and_patch workflow in Akash-Sriram/GooglePhotos-Patched..."
          curl -s -X POST \
            -H "Authorization: token $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/Akash-Sriram/GooglePhotos-Patched/actions/workflows/build_and_patch.yml/dispatches \
            -d '{"ref":"main"}'
