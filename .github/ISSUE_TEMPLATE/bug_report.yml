name: 🐞 Bug report
description: Report a bug or an issue.
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        # Morphe Patches bug report

        Before creating a new bug report, please keep the following in mind:

        - **Do not submit a duplicate bug report**: Search for existing bug reports [here](https://github.com/Akash-Sriram/morphe-google-photos/issues?q=is%3Aissue).
  - type: textarea
    attributes:
      label: Bug description
      description: |
        - List app version patched, and the patches version shown in Settings > About
        - Add steps to reproduce the bug if possible (Step 1. ... Step 2. ...)
    validations:
        required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Screen recordings (Optional)
      description: |
        Attach any relevant screenshots or screen recordings.
        **Image size**: Keep screenshots compact for scrolling rather than filling the whole screen:
        - Resize image with `<img width="300" src="...">` (remove `height="..."` if auto-inserted).
        - Or wrap screenshots in a collapsible section:
          `<details><summary>Screenshots</summary>...<img width="300" src="...">...</details>`
      placeholder: |
        <!-- Tip: When pasting images, resize with: <img width="300" src="..."> -->
  - type: textarea
    attributes:
      label: Error logs
      description: |
        Please provide the diagnostic log or crash report:
        - **Option 1 (Recommended)**: In Google Photos, go to **Settings > Diagnostics & Logs**. Tap **Export File** and drag-and-drop the exported `.log` file into this box, OR tap **Copy (GitHub)** and paste the pre-formatted report directly.
        - **Option 2 (Terminal/ADB)**: Run `adb logcat -d -s AndroidRuntime:E DEBUG:*` to capture clean crash exceptions.
        - **Notice**: If your log is longer than 25 lines, please attach the `.log` or `.txt` file instead of pasting an uncollapsed wall of text.
      render: shell
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your bug report will be closed if you don't follow the checklist below.
      options:
        - label: I have checked all open and closed bug reports and this is not a duplicate.
          required: true
        - label: All requested information has been provided properly.
          required: true
