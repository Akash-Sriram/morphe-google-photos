name: ⭐ Feature request
description: Create a detailed request for a new feature.
title: 'feat: '
labels: ['feature']
body:
  - type: markdown
    attributes:
      value: |
        # Morphe Patches feature request

        Before creating a new feature request, please keep the following in mind:

        - **Do not submit a duplicate feature request**: Search for existing feature requests, including closed issues, [here](https://github.com/Akash-Sriram/morphe-google-photos/issues?q=is%3Aissue).
  - type: textarea
    attributes:
      label: Feature description
      description: |
        - Describe your feature in detail
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Mockups (Optional)
      description: |
        Attach any relevant screenshots or mockups.
        **Image size**: Keep screenshots compact for scrolling rather than filling the whole screen:
        - Resize image with `<img width="300" src="...">` (remove `height="..."` if auto-inserted).
        - Or wrap screenshots in a collapsible section:
          `<details><summary>Screenshots</summary>...<img width="300" src="...">...</details>`
      placeholder: |
        <!-- Tip: When pasting images, resize with: <img width="300" src="..."> -->
  - type: textarea
    attributes:
      label: Motivation
      description: | 
        A strong motivation is necessary for a feature request to be considered.
        
        - Why should this feature be implemented? 
        - What is the explicit use case?
        - What are the benefits?
        - What makes this feature important?
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your feature request will be closed if you don't follow the checklist below.
      options:
        - label: I have checked all open and closed feature requests and this is not a duplicate
          required: true
